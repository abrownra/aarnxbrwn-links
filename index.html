<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>AARNxBRWN</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=VT323&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #000; }
    body {
      background: #000;
      color: #fff;
      font-family: 'DM Sans', -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: transform 60ms steps(1);
    }

    body.glitch { transform: translateX(2px); }

    /* ================================================================
       FILM GRAIN
    ================================================================ */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 9000;
      pointer-events: none;
      opacity: 0.055;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
      background-size: 180px 180px;
      animation: grainShift 0.35s steps(1) infinite;
    }

    @keyframes grainShift {
      0%   { background-position:   0px   0px; }
      20%  { background-position: -32px  12px; }
      40%  { background-position:  22px -18px; }
      60%  { background-position: -12px  24px; }
      80%  { background-position:  18px  -6px; }
      100% { background-position:   0px   0px; }
    }

    /* ================================================================
       TV INTRO
    ================================================================ */
    #tv-flash {
      position: fixed; inset: 0;
      z-index: 9999; background: #fff;
      pointer-events: none; opacity: 0;
      animation: tvFlash 0.45s ease-out 0.05s forwards;
    }
    @keyframes tvFlash { 0%{opacity:0} 18%{opacity:0.92} 100%{opacity:0} }

    #tv-bar-top, #tv-bar-bottom {
      position: fixed; left: 0; right: 0;
      z-index: 9998; background: #000;
      pointer-events: none;
    }
    #tv-bar-top    { top: 0;    height: 50.5%; animation: barUp   1.05s cubic-bezier(0.4,0,0.85,1) 0.22s forwards; }
    #tv-bar-bottom { bottom: 0; height: 50.5%; animation: barDown 1.05s cubic-bezier(0.4,0,0.85,1) 0.22s forwards; }

    #tv-bar-top::after {
      content:''; position:absolute;
      bottom:0; left:0; right:0; height:2px;
      background:rgba(255,255,255,0.55);
    }
    #tv-bar-bottom::before {
      content:''; position:absolute;
      top:0; left:0; right:0; height:2px;
      background:rgba(255,255,255,0.55);
    }
    @keyframes barUp   { 0%{transform:translateY(0)} 12%{transform:translateY(-1.5%)}  100%{transform:translateY(-101%)} }
    @keyframes barDown { 0%{transform:translateY(0)} 12%{transform:translateY( 1.5%)}  100%{transform:translateY( 101%)} }

    /* ================================================================
       HERO
    ================================================================ */
    #hero {
      position: relative;
      height: 100svh; min-height: 520px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    #hero-static {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      z-index: 0;
      opacity: 0.52;
    }

    .scanlines {
      position: absolute; inset: 0; z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 2px,
        rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px
      );
    }

    .scan-sweep {
      position: absolute; left: 0; right: 0; height: 90px;
      background: linear-gradient(
        to bottom,
        transparent 0%, rgba(255,255,255,0.016) 40%,
        rgba(255,255,255,0.042) 50%, rgba(255,255,255,0.016) 60%,
        transparent 100%
      );
      z-index: 3; pointer-events: none; top: -15%;
      animation: sweepDown 7s linear infinite;
    }
    @keyframes sweepDown { from{top:-18%} to{top:118%} }

    .hero-vignette {
      position: absolute; inset: 0; z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse 65% 52% at 50% 50%, rgba(0,0,0,0.7) 0%, transparent 100%);
    }

    .hero-content {
      position: relative; z-index: 5;
      text-align: center; padding: 0 24px;
      opacity: 0;
    }

    .logo-img {
      max-width: 260px; width: 72vw;
      height: auto; display: block; margin: 0 auto;
      shape-rendering: geometricPrecision;
    }

    .logo-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(58px,18vw,96px);
      letter-spacing: 5px; line-height: 1;
      display: none; color: #fff;
    }

    .hero-fade {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to bottom, transparent, #000);
      z-index: 6; pointer-events: none;
    }

    /* ================================================================
       SECTIONS ARC — perspective container
    ================================================================ */
    #sections {
      display: flex; flex-direction: column;
      perspective: 1100px;
      perspective-origin: 50% 0%;
    }

    /* ================================================================
       BLOCK WRAP — handles the 3-D crescent rotation
    ================================================================ */
    .block-wrap {
      will-change: transform;
      transition: transform 0.42s cubic-bezier(0.25,0.46,0.45,0.94),
                  box-shadow 0.42s;
    }

    .block-wrap:nth-child(1) { transform: rotateY(-7deg); }
    .block-wrap:nth-child(2) { transform: rotateY(-2.5deg); }
    .block-wrap:nth-child(3) { transform: rotateY( 2.5deg); }
    .block-wrap:nth-child(4) { transform: rotateY( 7deg); }

    .block-wrap:hover {
      transform: rotateY(0deg) translateZ(18px);
      box-shadow: -8px 0 32px rgba(255,255,255,0.04);
    }

    /* ================================================================
       BLOCK BASE
    ================================================================ */
    .block {
      position: relative; overflow: hidden;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      cursor: pointer; background: #000;
      opacity: 0; transform: translateY(28px);
    }

    /* Slide-in top line */
    .block::before {
      content: ''; position: absolute;
      top: 0; left: 0; width: 0; height: 1px;
      background: rgba(255,255,255,0.5);
      z-index: 4; pointer-events: none;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .block:hover::before  { width: 100%; }
    .block.is-open::before { width: 100%; background: rgba(255,255,255,0.22); }

    /* ================================================================
       CH INDICATOR — top-right TV channel overlay
    ================================================================ */
    .ch-indicator {
      position: absolute;
      top: 14px; right: 18px;
      z-index: 5;
      display: flex; align-items: center; gap: 6px;
      pointer-events: none;
      opacity: 0.28;
      transition: opacity 0.3s;
    }

    .block:hover .ch-indicator,
    .block.is-open .ch-indicator { opacity: 0.85; }

    /* 3-bar signal strength */
    .ch-signal {
      display: flex; align-items: flex-end; gap: 2px; height: 10px;
    }
    .ch-signal span {
      width: 3px; background: rgba(255,255,255,0.5);
      transition: background 0.3s;
    }
    .ch-signal span:nth-child(1) { height: 4px; }
    .ch-signal span:nth-child(2) { height: 7px; }
    .ch-signal span:nth-child(3) { height: 10px; }

    .block:hover .ch-signal span,
    .block.is-open .ch-signal span { background: #fff; }

    /* CH number — VT323 pixel font */
    .ch-num {
      font-family: 'VT323', monospace;
      font-size: 13px;
      letter-spacing: 1px;
      color: #fff;
      line-height: 1;
    }

    /* Blinking "on air" dot */
    .ch-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .block.is-open .ch-dot {
      background: #fff;
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ================================================================
       BLOCK HEADER
    ================================================================ */
    .block-header {
      position: relative; z-index: 3;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; min-height: 120px;
      text-decoration: none; color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    /* Ghost index watermark */
    .block-num {
      position: absolute; right: 62px; top: 50%;
      transform: translateY(-50%);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(72px,20vw,110px);
      line-height: 1;
      color: rgba(255,255,255,0.03);
      user-select: none; pointer-events: none; z-index: 0;
      transition: color 0.4s;
    }
    .block:hover .block-num { color: rgba(255,255,255,0.055); }

    .block-label {
      position: relative; z-index: 1;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(52px,14vw,76px);
      letter-spacing: 2px; line-height: 1;
      color: rgba(255,255,255,0.86);
      transition: color 0.3s, letter-spacing 0.4s;
    }
    .block:hover .block-label  { color: #fff; letter-spacing: 3px; }
    .block.is-open .block-label { color: #fff; }

    /* Plus/× icon */
    .block-icon {
      position: relative; z-index: 1;
      flex-shrink: 0; width: 22px; height: 22px;
      opacity: 0.32;
      transition: opacity 0.3s, transform 0.42s cubic-bezier(0.34,1.4,0.64,1);
    }
    .block-icon::before, .block-icon::after {
      content: ''; position: absolute; background: #fff;
    }
    .block-icon::before { width:1px; height:100%; left:50%; top:0; transform:translateX(-50%); }
    .block-icon::after  { width:100%; height:1px; top:50%; left:0; transform:translateY(-50%); }
    .block:hover .block-icon   { opacity: 0.65; }
    .block.is-open .block-icon { opacity: 1; transform: rotate(45deg); }

    /* Arrow for direct-link blocks */
    .block-arrow {
      position: relative; z-index: 1;
      flex-shrink: 0; opacity: 0.32; color: #fff;
      transition: opacity 0.3s, transform 0.3s;
    }
    .block:hover .block-arrow { opacity: 1; transform: translate(4px,-4px); }

    /* ================================================================
       EXPANDABLE BODY
    ================================================================ */
    .block-body {
      position: relative; z-index: 3;
      max-height: 0; overflow: hidden;
      transition: max-height 0.6s cubic-bezier(0.4,0,0.2,1);
    }
    .block.is-open .block-body { max-height: 760px; }
    .block-body-inner { padding: 0 24px 36px; }

    /* ================================================================
       MUSIC — PLATFORM LIST
    ================================================================ */
    .platform-list { display: flex; flex-direction: column; }

    .plat-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      text-decoration: none;
      color: rgba(255,255,255,0.42);
      font-size: 11px; letter-spacing: 2.5px;
      text-transform: uppercase; font-family: 'DM Sans', sans-serif;
      transition: color 0.22s, padding-left 0.22s;
      -webkit-tap-highlight-color: transparent;
    }
    .plat-item:first-child { border-top: 1px solid rgba(255,255,255,0.07); }
    .plat-item:hover { color: #fff; padding-left: 6px; }

    .plat-item svg {
      flex-shrink: 0; opacity: 0;
      transform: translate(-4px,4px);
      transition: opacity 0.22s, transform 0.22s;
    }
    .plat-item:hover svg { opacity: 1; transform: translate(0,0); }

    /* ================================================================
       VIDEOS
    ================================================================ */
    .embed-wrap {
      position: relative; width: 100%; padding-bottom: 56.25%;
      background: #080808; overflow: hidden; margin-bottom: 12px;
    }
    .embed-wrap iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border: none;
    }

    .ch-links {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: rgba(255,255,255,0.07);
    }
    .ch-link {
      display: flex; align-items: center; justify-content: center;
      padding: 14px; background: #000;
      text-decoration: none;
      color: rgba(255,255,255,0.38);
      font-size: 10px; letter-spacing: 2px;
      font-family: 'VT323', monospace; font-size: 14px;
      text-transform: uppercase;
      transition: color 0.22s, background 0.22s;
      -webkit-tap-highlight-color: transparent;
    }
    .ch-link:hover { color: #fff; background: rgba(255,255,255,0.04); }

    /* ================================================================
       FOOTER
    ================================================================ */
    footer {
      padding: 52px 24px 48px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .social-row {
      display: flex; align-items: center; justify-content: center;
      gap: 28px; margin-bottom: 36px;
    }

    .social-link {
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.32);
      text-decoration: none;
      transition: color 0.22s, transform 0.22s;
      -webkit-tap-highlight-color: transparent;
    }
    .social-link:hover { color: #fff; transform: translateY(-3px); }
    .social-link svg { width: 20px; height: 20px; fill: currentColor; }

    footer small {
      font-family: 'VT323', monospace;
      font-size: 13px; letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.14);
    }

    /* ================================================================
       DESKTOP
    ================================================================ */
    @media (min-width: 640px) {
      .block-header     { padding: 0 40px; min-height: 136px; }
      .block-body-inner { padding: 0 40px 44px; }
      .block-num        { right: 82px; }
      .ch-indicator     { top: 18px; right: 24px; }
    }
    @media (min-width: 900px) {
      #sections {
        max-width: 720px; margin: 0 auto;
        border-left:  1px solid rgba(255,255,255,0.05);
        border-right: 1px solid rgba(255,255,255,0.05);
      }
    }
  </style>
</head>

    <!-- STORE -->

          <span class="block-label">Store</span>
          <span class="block-arrow" aria-hidden="true">

    <!-- EMAIL LIST -->

  </main>

  <!-- ================================================================
       SCRIPT
  ================================================================ -->
  <script>
    /* ================================================================
       CONFIG
    ================================================================ */
    const CONFIG = {
      platforms: [
        { name: 'Apple Music', url: 'https://music.apple.com/us/artist/aarnxbrwn/1291517666' },
        { name: 'Spotify',     url: 'https://open.spotify.com/artist/592E2jqU9fpWj230gI0Ab1' },
        { name: 'Tidal',       url: 'https://tidal.com/artist/9155431' },
        { name: 'SoundCloud',  url: 'https://soundcloud.com/aarnxbrwn' },
        { name: 'Bandcamp',    url: 'https://aarnxbrwn.bandcamp.com' },
      ],
      beehiiv: 'https://YOUR-NAME.beehiiv.com/subscribe',
    };

    /* ================================================================
       REALISTIC TV STATIC
       - Gaussian-ish grey distribution (bell curve via summed randoms)
       - Per-row scanline brightness variance
       - Horizontal noise correlation (elongated pixel texture)
       - Drifting interference band
       - Per-frame luminance drift
    ================================================================ */
    (function () {
      const canvas = document.getElementById('hero-static');
      const ctx    = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      let last = 0;
      const FPS = 24;

      let bandY      = h * 0.4;
      let brightness = 128;

      function draw(ts) {
        requestAnimationFrame(draw);
        if (ts - last < 1000 / FPS) return;
        last = ts;

        // Drift overall brightness each frame
        brightness += (Math.random() - 0.5) * 7;
        brightness = Math.min(148, Math.max(108, brightness));

        // Advance interference band (drifts slowly upward, wraps)
        bandY -= 0.55 + Math.random() * 0.25;
        if (bandY < -8) bandY = h + 6;

        const img = ctx.createImageData(w, h);
        const d   = img.data;

        for (let y = 0; y < h; y++) {
          // Per-scanline brightness bias — creates the horizontal banding
          const rowBias = (Math.random() - 0.5) * 22;

          // Interference band: bright streak that drifts up the screen
          const bDist     = Math.abs(y - bandY);
          const bandBoost = bDist < 4 ? (4 - bDist) * 14 : 0;

          // Horizontal noise seed with persistence (elongates noise into scanline texture)
          let hNoise = Math.random() * 255;

          for (let x = 0; x < w; x++) {
            // Update horizontal noise with ~60% carry-forward (elongated texture)
            hNoise = hNoise * 0.58 + Math.random() * 255 * 0.42;

            // Gaussian-ish vertical noise: two randoms averaged, then scaled
            const vNoise = (Math.random() + Math.random()) * 0.5 * 255;

            // Mix h and v noise; h gives texture, v gives grain
            let v = hNoise * 0.38 + vNoise * 0.62;
            v += (brightness - 128) + rowBias + bandBoost;
            v = v < 0 ? 0 : v > 255 ? 255 : v;

            const i = (y * w + x) * 4;
            d[i] = d[i+1] = d[i+2] = v;
            d[i+3] = 255;
          }
        }

        ctx.putImageData(img, 0, 0);
      }

      requestAnimationFrame(draw);
    })();

    /* ================================================================
       PLATFORM LIST
    ================================================================ */
    const arrowSVG = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><line x1="1" y1="11" x2="11" y2="1"/><polyline points="4 1 11 1 11 8"/></svg>`;

    const list = document.getElementById('platform-list');
    CONFIG.platforms.forEach(p => {
      const a = document.createElement('a');
      a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
      a.className = 'plat-item';
      a.innerHTML = `<span>${p.name}</span>${arrowSVG}`;
      list.appendChild(a);
    });

    document.getElementById('email-block').href = CONFIG.beehiiv;

    /* ================================================================
       EXPAND / COLLAPSE
    ================================================================ */
    function toggleBlock(block) {
      const opening = !block.classList.contains('is-open');
      document.querySelectorAll('[data-expandable]').forEach(b => {
        b.classList.remove('is-open');
        b.querySelector('.block-header').setAttribute('aria-expanded', 'false');
      });
      if (opening) {
        block.classList.add('is-open');
        block.querySelector('.block-header').setAttribute('aria-expanded', 'true');
      }
    }

    document.querySelectorAll('[data-expandable]').forEach(block => {
      const h = block.querySelector('.block-header');
      h.addEventListener('click',   ()  => toggleBlock(block));
      h.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleBlock(block); }
      });
    });

    /* ================================================================
       CHANNEL SCAN — on hover, rapidly cycle through channel numbers
       before landing on the correct one
    ================================================================ */
    document.querySelectorAll('.block-wrap').forEach((wrap, idx) => {
      const numEl    = wrap.querySelector('.ch-num');
      const finalNum = 'CH 0' + (idx + 1);
      let scanTimer  = null;

      wrap.addEventListener('mouseenter', () => {
        clearInterval(scanTimer);
        let ticks = 0;
        scanTimer = setInterval(() => {
          const r = Math.floor(Math.random() * 98) + 1;
          numEl.textContent = 'CH ' + (r < 10 ? '0' + r : r);
          ticks++;
          if (ticks >= 9) {
            clearInterval(scanTimer);
            numEl.textContent = finalNum;
          }
        }, 24);
      });

      wrap.addEventListener('mouseleave', () => {
        clearInterval(scanTimer);
        numEl.textContent = finalNum;
      });
    });

    /* ================================================================
       PERIODIC SYNC GLITCH — occasional 1-frame TV signal dropout
    ================================================================ */
    (function scheduleGlitch() {
      const delay = 18000 + Math.random() * 14000;
      setTimeout(() => {
        document.body.classList.add('glitch');
        setTimeout(() => {
          document.body.classList.remove('glitch');
          scheduleGlitch();
        }, 60);
      }, delay);
    })();

    /* ================================================================
       GSAP
    ================================================================ */
    window.addEventListener('load', () => {
      if (typeof gsap === 'undefined') return;
      gsap.registerPlugin(ScrollTrigger);

      gsap.to('#hero-content', {
        opacity: 1, duration: 0.75, ease: 'power2.out', delay: 1.45
      });

      gsap.utils.toArray('.block').forEach((el, i) => {
        gsap.to(el, {
          opacity: 1, y: 0, duration: 0.8, ease: 'power3.out',
          delay: i * 0.06,
          scrollTrigger: { trigger: el, start: 'top 90%', toggleActions: 'play none none none' }
        });
      });

      document.querySelector('[data-section="music"] .block-header')
        .addEventListener('click', () => setTimeout(() => {
          gsap.from('.plat-item', { opacity: 0, x: -12, duration: 0.3, stagger: 0.06, ease: 'power2.out' });
        }, 60));

      document.querySelector('[data-section="videos"] .block-header')
        .addEventListener('click', () => setTimeout(() => {
          gsap.from('.ch-link', { opacity: 0, y: 8, duration: 0.3, stagger: 0.08, ease: 'power2.out' });
        }, 60));
    });
  </script>
