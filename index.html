<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>AARNxBRWN</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #000; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ================================================================
       FILM GRAIN
    ================================================================ */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 9000;
      pointer-events: none;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
      background-size: 180px 180px;
      animation: grainShift 0.35s steps(1) infinite;
    }

    @keyframes grainShift {
      0%   { background-position:   0px   0px; }
      20%  { background-position: -32px  12px; }
      40%  { background-position:  22px -18px; }
      60%  { background-position: -12px  24px; }
      80%  { background-position:  18px  -6px; }
      100% { background-position:   0px   0px; }
    }

    /* ================================================================
       TV INTRO
    ================================================================ */

    /* 1 — white flash */
    #tv-flash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      pointer-events: none;
      opacity: 0;
      animation: tvFlash 0.45s ease-out 0.05s forwards;
    }

    @keyframes tvFlash {
      0%   { opacity: 0; }
      18%  { opacity: 0.92; }
      100% { opacity: 0; }
    }

    /* 2 — black bars slide away from center to reveal static below */
    #tv-bar-top,
    #tv-bar-bottom {
      position: fixed;
      left: 0; right: 0;
      z-index: 9998;
      background: #000;
      pointer-events: none;
    }

    #tv-bar-top    { top: 0;    height: 50.5%; animation: barUp   1.05s cubic-bezier(0.4,0,0.85,1) 0.22s forwards; }
    #tv-bar-bottom { bottom: 0; height: 50.5%; animation: barDown 1.05s cubic-bezier(0.4,0,0.85,1) 0.22s forwards; }

    /* Phosphor seam — bright 2px line at the meeting edges */
    #tv-bar-top::after {
      content: ''; position: absolute;
      bottom: 0; left: 0; right: 0; height: 2px;
      background: rgba(255,255,255,0.55);
    }
    #tv-bar-bottom::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: rgba(255,255,255,0.55);
    }

    @keyframes barUp {
      0%   { transform: translateY(0); }
      12%  { transform: translateY(-1.5%); }   /* warmup stutter */
      100% { transform: translateY(-101%); }
    }

    @keyframes barDown {
      0%   { transform: translateY(0); }
      12%  { transform: translateY(1.5%); }
      100% { transform: translateY(101%); }
    }

    /* ================================================================
       HERO
    ================================================================ */
    #hero {
      position: relative;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Canvas static — low-res, scaled up for chunky pixel look */
    #hero-static {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      z-index: 0;
      opacity: 0.48;
    }

    /* CRT horizontal scanlines */
    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent   0px,
        transparent   2px,
        rgba(0,0,0,0.14) 2px,
        rgba(0,0,0,0.14) 4px
      );
    }

    /* CRT refresh sweep — very faint bright band drifting downward */
    .scan-sweep {
      position: absolute;
      left: 0; right: 0;
      height: 90px;
      background: linear-gradient(
        to bottom,
        transparent              0%,
        rgba(255,255,255,0.018) 40%,
        rgba(255,255,255,0.045) 50%,
        rgba(255,255,255,0.018) 60%,
        transparent             100%
      );
      z-index: 3;
      pointer-events: none;
      top: -15%;
      animation: sweepDown 7s linear infinite;
    }

    @keyframes sweepDown {
      from { top: -18%; }
      to   { top: 118%; }
    }

    /* Radial vignette — keeps logo readable over the static */
    .hero-vignette {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(
        ellipse 65% 52% at 50% 50%,
        rgba(0,0,0,0.65) 0%,
        transparent 100%
      );
    }

    /* Logo / name */
    .hero-content {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 0 24px;
      opacity: 0; /* GSAP handles reveal */
    }

    .logo-img {
      max-width: 240px;
      width: 72vw;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Text fallback — shown when logo.png is missing */
    .logo-text {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(58px, 18vw, 96px);
      letter-spacing: 5px;
      line-height: 1;
      display: none;
      color: #fff;
    }

    /* Fade hero into black at the bottom — clean transition to sections */
    .hero-fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 110px;
      background: linear-gradient(to bottom, transparent, #000);
      z-index: 6;
      pointer-events: none;
    }

    /* ================================================================
       SECTIONS
    ================================================================ */
    #sections { display: flex; flex-direction: column; }

    /* ================================================================
       BLOCK BASE
    ================================================================ */
    .block {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      background: #000;
      opacity: 0;
      transform: translateY(28px);
    }

    /* White line slides in from left on hover */
    .block::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 0; height: 1px;
      background: rgba(255,255,255,0.5);
      z-index: 4;
      pointer-events: none;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }

    .block:hover::before  { width: 100%; }
    .block.is-open::before { width: 100%; background: rgba(255,255,255,0.22); }

    /* ================================================================
       BLOCK HEADER
    ================================================================ */
    .block-header {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      min-height: 120px;
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    /* Ghost index number watermark */
    .block-num {
      position: absolute;
      right: 62px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(72px, 20vw, 110px);
      line-height: 1;
      color: rgba(255,255,255,0.038);
      user-select: none;
      pointer-events: none;
      z-index: 0;
      transition: color 0.4s;
    }

    .block:hover .block-num { color: rgba(255,255,255,0.06); }

    .block-label {
      position: relative;
      z-index: 1;
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(48px, 14vw, 72px);
      letter-spacing: 3px;
      line-height: 1;
      color: rgba(255,255,255,0.86);
      transition: color 0.3s, letter-spacing 0.4s;
    }

    .block:hover .block-label  { color: #fff; letter-spacing: 4px; }
    .block.is-open .block-label { color: #fff; }

    /* Plus / × icon */
    .block-icon {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      width: 22px; height: 22px;
      opacity: 0.32;
      transition: opacity 0.3s, transform 0.42s cubic-bezier(0.34,1.4,0.64,1);
    }

    .block-icon::before,
    .block-icon::after {
      content: '';
      position: absolute;
      background: #fff;
    }

    .block-icon::before { width: 1px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
    .block-icon::after  { width: 100%; height: 1px; top: 50%; left: 0; transform: translateY(-50%); }

    .block:hover .block-icon   { opacity: 0.65; }
    .block.is-open .block-icon { opacity: 1; transform: rotate(45deg); }

    /* Arrow icon for direct-link blocks */
    .block-arrow {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      opacity: 0.32;
      color: #fff;
      transition: opacity 0.3s, transform 0.3s;
    }

    .block:hover .block-arrow { opacity: 1; transform: translate(4px,-4px); }

    /* ================================================================
       EXPANDABLE BODY
    ================================================================ */
    .block-body {
      position: relative;
      z-index: 3;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.6s cubic-bezier(0.4,0,0.2,1);
    }

    .block.is-open .block-body { max-height: 760px; }

    .block-body-inner { padding: 0 24px 36px; }

    /* ================================================================
       MUSIC — PLATFORM LIST
    ================================================================ */
    .platform-list { display: flex; flex-direction: column; }

    .plat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      text-decoration: none;
      color: rgba(255,255,255,0.42);
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: color 0.22s, padding-left 0.22s;
      -webkit-tap-highlight-color: transparent;
    }

    .plat-item:first-child { border-top: 1px solid rgba(255,255,255,0.07); }
    .plat-item:hover { color: #fff; padding-left: 6px; }

    .plat-item svg {
      flex-shrink: 0;
      opacity: 0;
      transform: translate(-4px, 4px);
      transition: opacity 0.22s, transform 0.22s;
    }

    .plat-item:hover svg { opacity: 1; transform: translate(0,0); }

    /* ================================================================
       VIDEOS
    ================================================================ */
    .embed-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #080808;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .embed-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .ch-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: rgba(255,255,255,0.07);
    }

    .ch-link {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: #000;
      text-decoration: none;
      color: rgba(255,255,255,0.38);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.22s, background 0.22s;
      -webkit-tap-highlight-color: transparent;
    }

    .ch-link:hover { color: #fff; background: rgba(255,255,255,0.04); }

    /* ================================================================
       FOOTER
    ================================================================ */
    footer {
      padding: 48px 24px 44px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    footer small {
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.11);
    }

    /* ================================================================
       DESKTOP
    ================================================================ */
    @media (min-width: 640px) {
      .block-header     { padding: 0 40px; min-height: 136px; }
      .block-body-inner { padding: 0 40px 44px; }
      .block-num        { right: 82px; }
    }

    @media (min-width: 900px) {
      #sections {
        max-width: 720px;
        margin: 0 auto;
        border-left:  1px solid rgba(255,255,255,0.05);
        border-right: 1px solid rgba(255,255,255,0.05);
      }
    }
  </style>
</head>
<body>

  <!-- Film grain overlay -->
  <div class="grain" aria-hidden="true"></div>

  <!-- TV intro — flash then bars slide apart -->
  <div id="tv-flash"      aria-hidden="true"></div>
  <div id="tv-bar-top"    aria-hidden="true"></div>
  <div id="tv-bar-bottom" aria-hidden="true"></div>

  <!-- ================================================================
       HERO
  ================================================================ -->
  <section id="hero">

    <!-- Canvas static: rendered at 320×180, CSS-stretched for chunky pixels -->
    <canvas id="hero-static" width="320" height="180" aria-hidden="true"></canvas>

    <div class="scanlines"    aria-hidden="true"></div>
    <div class="scan-sweep"   aria-hidden="true"></div>
    <div class="hero-vignette" aria-hidden="true"></div>

    <div class="hero-content" id="hero-content">
      <!--
        To add your logo: drop logo.png into this same folder.
        The text below shows automatically until then.
      -->
      <img
        src="logo.png"
        alt="AARNxBRWN"
        class="logo-img"
        id="logo-img"
        onerror="this.style.display='none';document.getElementById('logo-text').style.display='block';"
      >
      <div class="logo-text" id="logo-text">AARNxBRWN</div>
    </div>

    <div class="hero-fade" aria-hidden="true"></div>
  </section>

  <!-- ================================================================
       SECTIONS
  ================================================================ -->
  <main id="sections">

    <!-- MUSIC -->
    <div class="block" data-section="music" data-expandable>
      <span class="block-num" aria-hidden="true">01</span>
      <div class="block-header" role="button" aria-expanded="false" tabindex="0">
        <span class="block-label">Music</span>
        <span class="block-icon" aria-hidden="true"></span>
      </div>
      <div class="block-body">
        <div class="block-body-inner">
          <div class="platform-list" id="platform-list"></div>
        </div>
      </div>
    </div>

    <!-- VIDEOS -->
    <div class="block" data-section="videos" data-expandable>
      <span class="block-num" aria-hidden="true">02</span>
      <div class="block-header" role="button" aria-expanded="false" tabindex="0">
        <span class="block-label">Videos</span>
        <span class="block-icon" aria-hidden="true"></span>
      </div>
      <div class="block-body">
        <div class="block-body-inner">
          <div class="embed-wrap">
            <!--
              Featured video — swap VIDEO_ID to change which video shows:
              https://www.youtube.com/embed/VIDEO_ID?rel=0&modestbranding=1
            -->
            <iframe
              src="https://www.youtube.com/embed/0YApNPyQesI?rel=0&modestbranding=1"
              title="AARNxBRWN – Front Line"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
              loading="lazy"
            ></iframe>
          </div>
          <div class="ch-links">
            <a href="https://www.youtube.com/channel/UCxXbQXy8jZDstrgLcoQsRxQ"
               target="_blank" rel="noopener" class="ch-link">Topic Channel</a>
            <a href="https://www.youtube.com/@aarnxbrwn7126"
               target="_blank" rel="noopener" class="ch-link">Main Channel</a>
          </div>
        </div>
      </div>
    </div>

    <!-- STORE -->
    <a class="block" data-section="store"
       href="https://aarnxbrwn.bandcamp.com"
       target="_blank" rel="noopener">
      <span class="block-num" aria-hidden="true">03</span>
      <div class="block-header">
        <span class="block-label">Store</span>
        <span class="block-arrow" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
               stroke="currentColor" stroke-width="1" stroke-linecap="round">
            <line x1="2" y1="16" x2="16" y2="2"/>
            <polyline points="6 2 16 2 16 12"/>
          </svg>
        </span>
      </div>
    </a>

    <!-- EMAIL LIST -->
    <a class="block" data-section="email"
       href="https://YOUR-NAME.beehiiv.com/subscribe"
       target="_blank" rel="noopener"
       id="email-block">
      <span class="block-num" aria-hidden="true">04</span>
      <div class="block-header">
        <span class="block-label">Email List</span>
        <span class="block-arrow" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
               stroke="currentColor" stroke-width="1" stroke-linecap="round">
            <line x1="2" y1="16" x2="16" y2="2"/>
            <polyline points="6 2 16 2 16 12"/>
          </svg>
        </span>
      </div>
    </a>

  </main>

  <footer>
    <small>© 2025 AARNxBRWN</small>
  </footer>

  <!-- ================================================================
       SCRIPT — not deferred so canvas starts immediately
  ================================================================ -->
  <script>
    /* ================================================================
       CONFIG — only edit this block to update links
    ================================================================ */
    const CONFIG = {
      platforms: [
        { name: 'Apple Music', url: 'https://music.apple.com/us/artist/aarnxbrwn/1291517666' },
        { name: 'Spotify',     url: 'https://open.spotify.com/artist/592E2jqU9fpWj230gI0Ab1' },
        { name: 'Tidal',       url: 'https://tidal.com/artist/9155431' },
        { name: 'SoundCloud',  url: 'https://soundcloud.com/aarnxbrwn' },
        { name: 'Bandcamp',    url: 'https://aarnxbrwn.bandcamp.com' },
      ],
      beehiiv: 'https://YOUR-NAME.beehiiv.com/subscribe', // ← swap after Beehiiv setup
    };

    /* ================================================================
       CANVAS STATIC — 20fps chunky pixel noise
    ================================================================ */
    (function () {
      const canvas = document.getElementById('hero-static');
      const ctx    = canvas.getContext('2d');
      let last     = 0;
      const FPS    = 20;

      function draw(ts) {
        requestAnimationFrame(draw);
        if (ts - last < 1000 / FPS) return;
        last = ts;

        const { width: w, height: h } = canvas;
        const img = ctx.createImageData(w, h);
        const d   = img.data;

        for (let i = 0; i < d.length; i += 4) {
          const v = Math.random() > 0.5 ? 255 : 0;
          d[i] = d[i + 1] = d[i + 2] = v;
          d[i + 3] = 255;
        }

        ctx.putImageData(img, 0, 0);
      }

      requestAnimationFrame(draw);
    })();

    /* ================================================================
       PLATFORM LIST
    ================================================================ */
    const arrowSVG = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><line x1="1" y1="11" x2="11" y2="1"/><polyline points="4 1 11 1 11 8"/></svg>`;

    const list = document.getElementById('platform-list');
    CONFIG.platforms.forEach(p => {
      const a       = document.createElement('a');
      a.href        = p.url;
      a.target      = '_blank';
      a.rel         = 'noopener';
      a.className   = 'plat-item';
      a.innerHTML   = `<span>${p.name}</span>${arrowSVG}`;
      list.appendChild(a);
    });

    document.getElementById('email-block').href = CONFIG.beehiiv;

    /* ================================================================
       EXPAND / COLLAPSE
    ================================================================ */
    function toggleBlock(block) {
      const opening = !block.classList.contains('is-open');
      document.querySelectorAll('[data-expandable]').forEach(b => {
        b.classList.remove('is-open');
        b.querySelector('.block-header').setAttribute('aria-expanded', 'false');
      });
      if (opening) {
        block.classList.add('is-open');
        block.querySelector('.block-header').setAttribute('aria-expanded', 'true');
      }
    }

    document.querySelectorAll('[data-expandable]').forEach(block => {
      const h = block.querySelector('.block-header');
      h.addEventListener('click',   ()  => toggleBlock(block));
      h.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleBlock(block); }
      });
    });

    /* ================================================================
       GSAP
    ================================================================ */
    window.addEventListener('load', () => {
      if (typeof gsap === 'undefined') return;
      gsap.registerPlugin(ScrollTrigger);

      /* Logo fades in after TV bars finish (~1.4s) */
      gsap.to('#hero-content', {
        opacity: 1, duration: 0.75, ease: 'power2.out', delay: 1.45
      });

      /* Section blocks scroll in */
      gsap.utils.toArray('.block').forEach((el, i) => {
        gsap.to(el, {
          opacity: 1, y: 0,
          duration: 0.8, ease: 'power3.out',
          delay: i * 0.06,
          scrollTrigger: { trigger: el, start: 'top 90%', toggleActions: 'play none none none' }
        });
      });

      /* Platform links stagger when Music opens */
      document.querySelector('[data-section="music"] .block-header')
        .addEventListener('click', () => setTimeout(() => {
          gsap.from('.plat-item', { opacity: 0, x: -12, duration: 0.3, stagger: 0.06, ease: 'power2.out' });
        }, 60));

      /* Channel links stagger when Videos opens */
      document.querySelector('[data-section="videos"] .block-header')
        .addEventListener('click', () => setTimeout(() => {
          gsap.from('.ch-link', { opacity: 0, y: 8, duration: 0.3, stagger: 0.08, ease: 'power2.out' });
        }, 60));
    });
  </script>

</body>
</html>
